name: Kare derleme
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: kare
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Kare.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Kare sürüm ${{ github.run_number }}
          body: Telefona kurmak için Kare.apk dosyasını indir.
          files: Kare.apk
          make_latest: true
  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
